<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Agustinos Alicante Juvenil B · 2026-27</title>
<style>
:root {
  --navy:#0d1b2a; --navy2:#162032; --card:#1a2740; --card2:#1f2e4a;
  --gold:#f0a500; --gold2:#ffc740; --green:#2ecc71; --red:#e74c3c;
  --blue:#3a8fd1; --text:#e8edf5; --muted:#8899b0;
  --border:rgba(240,165,0,0.18); --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--navy);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
body{max-width:480px;margin:0 auto;padding:0 0 40px}
a{color:inherit;text-decoration:none}

.header{background:linear-gradient(160deg,#0a1520 0%,#162032 60%,#0d1b2a 100%);
  padding:26px 20px 18px;border-bottom:1px solid var(--border)}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.title{font-size:22px;font-weight:800;line-height:1.2}
.title span{color:var(--gold)}

.nav-grid{display:grid;grid-template-columns:repeat(6,1fr);background:var(--navy2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.nav-item{display:flex;flex-direction:column;align-items:center;padding:10px 2px 8px;cursor:pointer;
  border-bottom:2px solid transparent;gap:3px}
.nav-item.active{border-bottom-color:var(--gold);background:rgba(240,165,0,.06)}
.nav-icon{font-size:18px;line-height:1}
.nav-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.nav-item.active .nav-label{color:var(--gold)}
.tab{display:none}.tab.active{display:block}

.filters{display:flex;gap:8px;padding:12px 16px 0}
.filters select{flex:1;background:var(--card);color:var(--text);border:1px solid var(--border);
  border-radius:8px;padding:8px 10px;font-size:12px}
.section{padding:18px 16px 0}
.section-title{font-size:11px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);
  margin-bottom:12px;display:flex;align-items:center;gap:8px}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}

.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 6px;text-align:center}
.kpi b{display:block;font-size:24px;font-weight:900;color:var(--gold2);line-height:1}
.kpi small{display:block;font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-top:4px}
.pos{color:var(--green)!important}.neg{color:var(--red)!important}

.match{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:10px 12px;margin-bottom:8px}
.match.off{opacity:.5}
.badge{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;flex:none}
.badge.V{background:rgba(46,204,113,.18);color:var(--green)}
.badge.D{background:rgba(231,76,60,.18);color:var(--red)}
.badge.E{background:rgba(136,153,176,.2);color:var(--muted)}
.m-main{flex:1;min-width:0}
.m-rival{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-sub{font-size:10px;color:var(--muted);margin-top:2px}
.m-score{font-size:18px;font-weight:900;color:var(--gold2);white-space:nowrap}
.m-arrow{color:var(--muted);font-size:16px}

.subtabs{display:flex;gap:6px;margin-bottom:12px}
.subtab{flex:1;text-align:center;padding:8px;border-radius:8px;background:var(--card);border:1px solid var(--border);
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);cursor:pointer}
.subtab.active{background:rgba(240,165,0,.14);color:var(--gold);border-color:var(--gold)}

.tbl-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border);background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:8px 6px;text-align:center;white-space:nowrap}
th{font-size:9px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);background:var(--card2);cursor:pointer;user-select:none}
th.sorted{color:var(--gold)}
th:first-child,td:first-child{text-align:left;padding-left:10px;position:sticky;left:0;background:inherit}
td:first-child{background:var(--card)}
tr.prow{cursor:pointer;border-top:1px solid rgba(255,255,255,.04)}
tr.prow:active td{background:var(--card2)}
.pn{color:var(--gold);font-weight:800;margin-right:4px}
.val{font-weight:800;color:var(--gold2)}
.hint{font-size:10px;color:var(--muted);padding:8px 2px}

.zrow{margin-bottom:10px}
.zhead{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.zbar{height:8px;border-radius:4px;background:var(--card2);overflow:hidden}
.zbar i{display:block;height:100%;border-radius:4px}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:6px 12px;border-radius:20px;background:var(--card);border:1px solid var(--border);
  font-size:11px;font-weight:700;color:var(--muted);cursor:pointer}
.chip.active{background:rgba(240,165,0,.14);color:var(--gold);border-color:var(--gold)}
.gk-big{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px;margin-bottom:14px}
.gk-big .pct{font-size:36px;font-weight:900}
.gk-big .d{font-size:12px;color:var(--muted);line-height:1.5}

.modal-back{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;align-items:flex-end;justify-content:center}
.modal-back.open{display:flex}
.modal{width:100%;max-width:480px;max-height:85vh;overflow-y:auto;background:var(--navy2);
  border-radius:18px 18px 0 0;border:1px solid var(--border);padding:18px 16px 28px}
.modal h3{font-size:18px;margin-bottom:2px}
.modal .sub{font-size:11px;color:var(--muted);margin-bottom:14px}
.close{float:right;font-size:22px;color:var(--muted);cursor:pointer;line-height:1}
.spark{display:flex;align-items:flex-end;gap:6px;height:90px;margin:8px 0 16px;padding:0 4px}
.spark div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.spark i{display:block;width:100%;background:var(--gold);border-radius:4px 4px 0 0;min-height:2px}
.spark span{font-size:9px;color:var(--muted);margin-top:3px}
.spark em{font-size:9px;font-style:normal;color:var(--gold2);margin-bottom:2px}
.cmp-row{display:grid;align-items:center;gap:6px;padding:7px 0;border-top:1px solid rgba(255,255,255,.05);font-size:12px}
.cmp-lab{grid-column:1/-1;font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.cmp-cell{text-align:center;font-weight:700;padding:5px 2px;border-radius:6px;background:var(--card2)}
.cmp-cell.best{background:rgba(240,165,0,.18);color:var(--gold2)}
.cmp-head{display:grid;gap:6px;margin:4px 0 10px}
.cmp-head div{text-align:center;font-size:12px;font-weight:800;padding:8px 2px;border-radius:8px;border:2px solid}
.chart{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 8px 6px;margin-bottom:14px}
.chart h4{font-size:11px;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase;margin:0 6px 8px;font-weight:700}
.legend{display:flex;gap:12px;font-size:10px;color:var(--muted);margin:2px 8px 6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
.empty{padding:30px 16px;text-align:center;color:var(--muted);font-size:13px}
</style>
</head>

// ---------- RESUMEN
function renderResumen(){
  const ms = F();
  const pj = ms.length;
  const v = ms.filter(m=>m.our>m.their).length;
  const e = ms.filter(m=>m.our===m.their).length;
  const d = pj-v-e;
  const gf = ms.reduce((a,m)=>a+m.our,0), gc = ms.reduce((a,m)=>a+m.their,0);
  const dif = gf-gc;
  const avg = n => pj ? (n/pj).toFixed(1) : '–';
  const ht = ms.reduce((a,m)=>a+(m.ht_our-m.ht_their),0);
  const st = dif-ht;
  const sg = n => (n>0?'+':'')+n;
  let h = '<div class="section"><div class="section-title">Balance</div><div class="kpi-grid">'
    + '<div class="kpi"><b>'+pj+'</b><small>Jugados</small></div>'
    + '<div class="kpi"><b>'+v+'-'+e+'-'+d+'</b><small>V · E · D</small></div>'
    + '<div class="kpi"><b class="'+(dif>0?'pos':dif<0?'neg':'')+'">'+sg(dif)+'</b><small>Diferencia</small></div>'
    + '<div class="kpi"><b>'+gf+'</b><small>Goles a favor</small></div>'
    + '<div class="kpi"><b>'+gc+'</b><small>Goles en contra</small></div>'
    + '<div class="kpi"><b>'+avg(gf)+' / '+avg(gc)+'</b><small>Media GF / GC</small></div>'
    + '<div class="kpi"><b class="'+(ht>0?'pos':ht<0?'neg':'')+'">'+sg(ht)+'</b><small>1ª parte</small></div>'
    + '<div class="kpi"><b class="'+(st>0?'pos':st<0?'neg':'')+'">'+sg(st)+'</b><small>2ª parte</small></div>'
    + '<div class="kpi"><b>'+ms.reduce((a,m)=>a+m.excl_own,0)+' / '+ms.reduce((a,m)=>a+m.excl_rival,0)+'</b><small>Excl. propias / rival</small></div>'
    + '</div></div>';
  h += '<div class="section"><div class="section-title">Partidos</div>';
  if(!S.matches.length) h += '<div class="empty">Sin partidos</div>';
  const list = S.matches.slice().reverse();
  list.forEach(m => {
    const r = m.our>m.their?'V':m.our<m.their?'D':'E';
    const off = (!okMatch(m)) ? ' off' : '';
    const sub = [m.fecha?fdate(m.fecha):'', m.jornada?('J'+m.jornada):'', m.competicion, m.condicion, m.computa?'':'no computa']
      .filter(Boolean).join(' · ');
    h += '<a class="match'+off+'" href="'+m.link+'"><div class="badge '+r+'">'+r+'</div>'
      + '<div class="m-main"><div class="m-rival">'+esc(m.rival)+'</div><div class="m-sub">'+esc(sub)+'</div></div>'
      + '<div class="m-score">'+m.our+'–'+m.their+'</div><div class="m-arrow">›</div></a>';
  });
  h += '</div>';
  document.getElementById('tab-resumen').innerHTML = h;
}

// ---------- JUGADORES
function aggPlayer(p){
  const cods = okCods();
  const rows = p.rows.filter(r=>cods.has(r.cod));
  if(!rows.length) return null;
  const sum = k => rows.reduce((a,r)=>a+(r[k]||0),0);
  const vr = rows.filter(r=>r.val_norm!==null);
  const vmin = vr.reduce((a,r)=>a+r.val_min,0);
  const vraw = vr.reduce((a,r)=>a+r.val_raw,0);
  return {
    p, rows, pj: rows.length, min: sum('min'), goles: sum('goles'), lanz: sum('lanz'),
    asist: sum('asist'), robos: sum('robos'), perd: sum('perd'), bloq: sum('bloq'),
    x1e: sum('x1e'), x1f: sum('x1f'), faltas: sum('faltas'), excl: sum('excl'),
    efic: sum('lanz') ? sum('goles')/sum('lanz') : -1,
    val: vmin ? vraw/vmin*10 : -99
  };
}
const COLS = {
  atk: [['pj','PJ'],['min','Min'],['goles','G'],['lanz','L'],['efic','%'],['asist','As'],['perd','Pér'],['val','VAL']],
  def: [['pj','PJ'],['min','Min'],['robos','Rob'],['bloq','Blq'],['x1e','1x1+'],['x1f','1x1−'],['faltas','Flt'],['excl','Exc']]
};
function cell(a,k){
  if(k==='min') return mmss(a.min);
  if(k==='efic') return a.efic<0?'–':Math.round(a.efic*100)+'%';
  if(k==='val') return a.val===-99?'–':'<span class="val">'+a.val.toFixed(1)+'</span>';
  return a[k];
}
function renderJug(){
  const cols = COLS[state.sub];
  if(!cols.some(c=>c[0]===state.sortKey)) { state.sortKey = state.sub==='atk'?'val':'min'; state.sortDir=-1; }
  let data = Object.values(S.players).map(aggPlayer).filter(Boolean);
  data.sort((a,b)=> (a[state.sortKey]-b[state.sortKey])*state.sortDir);
  let h = '<div class="section"><div class="subtabs">'
    + '<div class="subtab '+(state.sub==='atk'?'active':'')+'" data-sub="atk">Ataque</div>'
    + '<div class="subtab '+(state.sub==='def'?'active':'')+'" data-sub="def">Defensa</div></div>';
  if(!data.length){ document.getElementById('tab-jugadores').innerHTML = h+'<div class="empty">Sin datos con estos filtros</div></div>'; return; }
  h += '<div class="tbl-wrap"><table><thead><tr><th data-k="name">Jugador</th>'
    + cols.map(c=>'<th data-k="'+c[0]+'" class="'+(state.sortKey===c[0]?'sorted':'')+'">'+c[1]+(state.sortKey===c[0]?(state.sortDir>0?' ▲':' ▼'):'')+'</th>').join('')
    + '</tr></thead><tbody>';
  data.forEach(a=>{
    h += '<tr class="prow" data-p="'+esc(a.p.num+'-'+a.p.name)+'"><td><span class="pn">'+a.p.num+'</span>'+esc(a.p.name)+'</td>'
      + cols.map(c=>'<td>'+cell(a,c[0])+'</td>').join('')+'</tr>';
  });
  h += '</tbody></table></div><div class="hint">Pulsa la cabecera para ordenar · pulsa un jugador para ver su evolución. '
    + 'VAL = valoración media por 10 min (mín. '+S.min_val+' min por partido). Porteros excluidos.</div></div>';
  document.getElementById('tab-jugadores').innerHTML = h;
}
function teamVal(){
  const cods = okCods(); let vr=0, vm=0;
  Object.values(S.players).forEach(p=>p.rows.forEach(r=>{ if(cods.has(r.cod) && r.val_norm!==null){ vr+=r.val_raw; vm+=r.val_min; } }));
  return vm ? vr/vm*10 : null;
}
function signedBars(labels, vals, lines){
  const W=440, H=190, L=30, R=10, T=18, B=28;
  const nums = vals.filter(v=>v!==null).concat(lines.map(l=>l.v).filter(v=>v!==null), [0]);
  let mn=Math.min(...nums), mx=Math.max(...nums);
  const pad=(mx-mn)*0.12||1; mn-=pad; mx+=pad;
  const y = v => T + (H-T-B)*(1-(v-mn)/(mx-mn));
  const n=labels.length, slot=(W-L-R)/n, bw=Math.min(40, slot*0.55);
  let g='';
  const ticks=4;
  for(let k=0;k<=ticks;k++){ const v=mn+(mx-mn)*k/ticks;
    g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="rgba(255,255,255,.06)"/><text x="'+(L-4)+'" y="'+(y(v)+3)+'" text-anchor="end" font-size="9" fill="#8899b0">'+v.toFixed(0)+'</text>'; }
  g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="rgba(255,255,255,.35)" stroke-width="1.2"/>';
  vals.forEach((v,i)=>{
    const cx=L+slot*i+slot/2;
    if(v===null){ g+='<text x="'+cx+'" y="'+(y(0)-4)+'" text-anchor="middle" font-size="10" fill="#8899b0">–</text>'; }
    else {
      const y0=y(0), y1=y(v), top=Math.min(y0,y1), h=Math.max(2,Math.abs(y1-y0));
      const c = v>=0 ? '#f0a500' : '#e74c3c';
      g+='<rect x="'+(cx-bw/2)+'" y="'+top+'" width="'+bw+'" height="'+h+'" rx="3" fill="'+c+'" opacity=".9"/>'
        +'<text x="'+cx+'" y="'+(v>=0? top-4 : top+h+11)+'" text-anchor="middle" font-size="10" font-weight="700" fill="'+(v>=0?'#ffc740':'#ff8a7d')+'">'+v.toFixed(1)+'</text>';
    }
    g+='<text x="'+cx+'" y="'+(H-10)+'" text-anchor="middle" font-size="9" fill="#8899b0">'+esc(labels[i])+'</text>';
  });
  lines.forEach(l=>{ if(l.v===null) return;
    g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(l.v)+'" y2="'+y(l.v)+'" stroke="'+l.color+'" stroke-width="1.8" stroke-dasharray="6 4"/>'; });
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%">'+g+'</svg>';
}

  h += '<div class="section-title" style="margin-top:14px">VAL/10 por partido</div><div class="chart">'

        return '<tr><td>'+esc(m.rival)+'</td><td>'+mmss(r.min)+'</td><td>'+r.goles+'/'+r.lanz+'</td><td>'+r.asist+'</td><td>'+r.robos+'</td><td>'+r.perd+'</td><td>'+(r.val_norm===null?'–':'<span class="val" style="'+(r.val_norm<0?'color:var(--red)':'')+'">'+r.val_norm.toFixed(1)+'</span>')+'</td></tr>';
      }).join('')+'</tbody></table></div>'
    + '<div class="hint">Las líneas discontinuas son la media de la temporada (con los filtros activos). Las barras por encima de la línea son partidos mejores que su media. Sin valoración si jugó menos de '+S.min_val+' min.</div>';
  document.getElementById('modal').innerHTML = h;
  document.getElementById('modalBack').classList.add('open');

  keys.forEach(k=>{
    S.gks[k].rows.filter(r=>cods.has(r.cod)).forEach(r=>{
      out.min += r.min; out.paradas += r.paradas; out.total += r.total;
      out.rows.push(Object.assign({k:k}, r));
      Object.entries(r.zones).forEach(([z,v])=>{
        out.zones[z] = out.zones[z] || {paradas:0,total:0};
        out.zones[z].paradas += v.paradas; out.zones[z].total += v.total;
      });
    });
  });
  return out;
}
function renderPorteros(){
  const keys = Object.keys(S.gks).sort((a,b)=>{
    const ta = aggGK([a]).total, tb = aggGK([b]).total; return tb-ta;
  });
  if(!keys.length){ document.getElementById('tab-porteros').innerHTML='<div class="empty">Sin porteros</div>'; return; }
  const sel = state.gk==='TODOS' || S.gks[state.gk] ? state.gk : 'TODOS';
  const use = sel==='TODOS' ? keys : [sel];
  const a = aggGK(use);
  let h = '<div class="section"><div class="chips">'
    + ['TODOS'].concat(keys).map(k=>'<div class="chip '+(k===sel?'active':'')+'" data-gk="'+esc(k)+'">'
        + (k==='TODOS'?'Todos':'#'+S.gks[k].num+' '+esc(S.gks[k].name))+'</div>').join('')
    + '</div>';
  const pc = pct(a.paradas, a.total);
  h += '<div class="gk-big"><div class="pct" style="color:'+col(pc)+'">'+(pc===null?'–':pc+'%')+'</div>'
    + '<div class="d">'+a.paradas+' paradas de '+a.total+' tiros<br>⏱ '+mmss(a.min)+' en pista<br>'
    + (a.min>0 ? (a.total/a.min*10).toFixed(1)+' tiros / 10 min' : '')+'</div></div>';
  h += '<div class="section-title">Por zona</div>';
  ZONES.forEach(z=>{
    const v = a.zones[z] || {paradas:0,total:0};
    const p = pct(v.paradas, v.total);
    h += '<div class="zrow"><div class="zhead"><span>'+ZLABEL[z]+'</span><span>'+v.paradas+'/'+v.total+' · <b>'+(p===null?'–':p+'%')+'</b></span></div>'
      + '<div class="zbar"><i style="width:'+(p||0)+'%;background:'+col(p)+'"></i></div></div>';
  });
  h += '<div class="section-title" style="margin-top:18px">Por partido</div><div class="tbl-wrap"><table><thead><tr><th>Partido</th>'
    + (sel==='TODOS'?'<th>Port.</th>':'')+'<th>Min</th><th>Par/Tiros</th><th>%</th></tr></thead><tbody>'
    + a.rows.map(r=>{ const m=byCod[r.cod]; const p=pct(r.paradas,r.total);
        return '<tr><td>'+esc(m.rival)+'</td>'+(sel==='TODOS'?'<td>#'+S.gks[r.k].num+'</td>':'')
          +'<td>'+mmss(r.min)+'</td><td>'+r.paradas+'/'+r.total+'</td><td style="color:'+col(p)+'">'+(p===null?'–':p+'%')+'</td></tr>';
      }).join('')+'</tbody></table></div>'
    + '<div class="hint">Los lanzamientos rivales que salen fuera no cuentan para el porcentaje.</div></div>';
  document.getElementById('tab-porteros').innerHTML = h;
}

// ---------- ZONAS (ataque equipo)
function renderZonas(){
  const ms = F();
  const z = {};
  ms.forEach(m=>Object.entries(m.zones).forEach(([k,v])=>{
    z[k] = z[k]||{gol:0,total:0}; z[k].gol+=v.gol; z[k].total+=v.total; }));
  const tg = Object.values(z).reduce((a,v)=>a+v.gol,0), tt = Object.values(z).reduce((a,v)=>a+v.total,0);
  let h = '<div class="section"><div class="section-title">Eficacia de ataque por zona</div>';
  if(!tt){ document.getElementById('tab-zonas').innerHTML = h+'<div class="empty">Sin datos con estos filtros</div></div>'; return; }
  h += '<div class="gk-big"><div class="pct" style="color:'+col(pct(tg,tt))+'">'+pctTxt(tg,tt)+'</div>'
    + '<div class="d">'+tg+' goles de '+tt+' lanzamientos<br>'+ms.length+' partidos</div></div>';
  ZONES.forEach(k=>{
    const v = z[k]||{gol:0,total:0}; const p = pct(v.gol,v.total);
    h += '<div class="zrow"><div class="zhead"><span>'+ZLABEL[k]+'</span><span>'+v.gol+'/'+v.total+' · <b>'+(p===null?'–':p+'%')+'</b></span></div>'
      + '<div class="zbar"><i style="width:'+(p||0)+'%;background:'+col(p)+'"></i></div></div>';
  });
  h += '</div>';
  document.getElementById('tab-zonas').innerHTML = h;
}


// ---------- helpers de series
const PCOL = ['#f0a500','#3a8fd1','#2ecc71'];
function teamSeries(){
  const ms = F();
  const cods = ms.map(m=>m.cod);
  const val = cods.map(c=>{
    let vr=0, vm=0;
    Object.values(S.players).forEach(p=>p.rows.forEach(r=>{ if(r.cod===c && r.val_norm!==null){ vr+=r.val_raw; vm+=r.val_min; } }));
    return vm ? vr/vm*10 : null;
  });
  const efic = ms.map(m=>{ let g=0,t=0; Object.values(m.zones).forEach(z=>{g+=z.gol;t+=z.total}); return t? 100*g/t : null; });
  const par = cods.map(c=>{ let a=0,b=0; Object.values(S.gks).forEach(k=>k.rows.forEach(r=>{ if(r.cod===c){a+=r.paradas;b+=r.total;} })); return b? 100*a/b : null; });
  return {ms, val, efic, par};
}
function lineChart(labels, series, opts){
  const W=440, H=150, L=30, R=12, T=14, B=26;
  const all = series.flatMap(s=>s.data).filter(v=>v!==null);
  if(!all.length) return '<div class="empty">Sin datos</div>';
  let mn = opts.min!==undefined? opts.min : Math.min(...all), mx = opts.max!==undefined? opts.max : Math.max(...all);
  if(mx===mn){ mx+=1; mn-=1; }
  const pad=(mx-mn)*0.1; if(opts.min===undefined) mn-=pad; if(opts.max===undefined) mx+=pad;
  const n = labels.length;
  const x = i => n===1 ? (L+W-R)/2 : L + i*(W-L-R)/(n-1);
  const y = v => T + (H-T-B)*(1-(v-mn)/(mx-mn));
  let g='';
  for(let k=0;k<=3;k++){ const v=mn+(mx-mn)*k/3; g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="rgba(255,255,255,.07)"/><text x="'+(L-4)+'" y="'+(y(v)+3)+'" text-anchor="end" font-size="9" fill="#8899b0">'+(opts.fmt?opts.fmt(v):Math.round(v))+'</text>'; }
  labels.forEach((l,i)=>{ g+='<text x="'+x(i)+'" y="'+(H-8)+'" text-anchor="middle" font-size="9" fill="#8899b0">'+esc(l)+'</text>'; });
  series.forEach(s=>{
    let d='', pts='';
    s.data.forEach((v,i)=>{ if(v===null) return; d+=(d?'L':'M')+x(i)+' '+y(v)+' '; pts+='<circle cx="'+x(i)+'" cy="'+y(v)+'" r="3.5" fill="'+s.color+'"/><text x="'+x(i)+'" y="'+(y(v)-7)+'" text-anchor="middle" font-size="9" fill="'+s.color+'">'+(opts.fmt?opts.fmt(v):Math.round(v))+'</text>'; });
    g+='<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="2"/>'+pts;
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%">'+g+'</svg>';
}
function barsChart(labels, a, b){
  const W=440, H=150, L=28, R=8, T=14, B=26;
  const n=labels.length; const mx=Math.max(1,...a,...b);
  const slot=(W-L-R)/n, bw=Math.min(26, slot/2.6);
  const y=v=>T+(H-T-B)*(1-v/mx);
  let g='';
  for(let k=0;k<=3;k++){ const v=Math.round(mx*k/3); g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="rgba(255,255,255,.07)"/><text x="'+(L-4)+'" y="'+(y(v)+3)+'" text-anchor="end" font-size="9" fill="#8899b0">'+v+'</text>'; }
  labels.forEach((l,i)=>{
    const cx=L+slot*i+slot/2;
    g+='<rect x="'+(cx-bw-1)+'" y="'+y(a[i])+'" width="'+bw+'" height="'+(H-B-y(a[i]))+'" rx="3" fill="#f0a500"/><text x="'+(cx-bw/2-1)+'" y="'+(y(a[i])-3)+'" text-anchor="middle" font-size="9" fill="#ffc740">'+a[i]+'</text>'
      +'<rect x="'+(cx+1)+'" y="'+y(b[i])+'" width="'+bw+'" height="'+(H-B-y(b[i]))+'" rx="3" fill="#3a8fd1"/><text x="'+(cx+bw/2+1)+'" y="'+(y(b[i])-3)+'" text-anchor="middle" font-size="9" fill="#8bbbe3">'+b[i]+'</text>'
      +'<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle" font-size="9" fill="#8899b0">'+esc(l)+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%">'+g+'</svg>';
}

// ---------- EVOLUCIÓN
function renderEvolucion(){
  const t = teamSeries();
  const el = document.getElementById('tab-evolucion');
  if(!t.ms.length){ el.innerHTML='<div class="empty">Sin partidos con estos filtros</div>'; return; }
  const labels = t.ms.map(m=>m.rival.slice(0,7));
  let h = '<div class="section"><div class="section-title">Evolución del equipo</div>'
    + '<div class="chart"><h4>Goles por partido</h4>'+barsChart(labels, t.ms.map(m=>m.our), t.ms.map(m=>m.their))
    + '<div class="legend"><span><i style="background:#f0a500"></i>A favor</span><span><i style="background:#3a8fd1"></i>En contra</span></div></div>'
    + '<div class="chart"><h4>Eficacia de ataque (%)</h4>'+lineChart(labels,[{data:t.efic,color:'#f0a500'}],{min:0,max:100})+'</div>'
    + '<div class="chart"><h4>Valoración media del equipo (VAL/10 min)</h4>'+lineChart(labels,[{data:t.val,color:'#2ecc71'}],{fmt:v=>v.toFixed(1)})+'</div>'
    + '<div class="chart"><h4>% paradas de porteros</h4>'+lineChart(labels,[{data:t.par,color:'#3a8fd1'}],{min:0,max:100})+'</div>'
    + '<div class="hint">Partidos en orden cronológico. Respetan los filtros de arriba.</div></div>';
  el.innerHTML = h;
}

// ---------- COMPARAR
const MET = [
  ['pj','Partidos',a=>a.pj,true], ['min','Minutos',a=>mmss(a.min),true],
  ['goles','Goles',a=>a.goles,true], ['g10','Goles / 10 min',a=>a.min?(a.goles/a.min*10).toFixed(1):'–',true],
  ['efic','Eficacia lanzamiento',a=>a.efic<0?'–':Math.round(a.efic*100)+'%',true],
  ['asist','Asistencias',a=>a.asist,true], ['a10','Asist. / 10 min',a=>a.min?(a.asist/a.min*10).toFixed(1):'–',true],
  ['robos','Robos',a=>a.robos,true], ['perd','Pérdidas',a=>a.perd,false],
  ['x1e','1x1 def. éxito',a=>a.x1e,true], ['faltas','Faltas',a=>a.faltas,false], ['excl','Exclusiones',a=>a.excl,false],
  ['val','VAL / 10 min',a=>a.val===-99?'–':a.val.toFixed(1),true]
];
function metVal(a,k){
  if(k==='g10') return a.min? a.goles/a.min*10 : -1;
  if(k==='a10') return a.min? a.asist/a.min*10 : -1;
  return a[k];
}
function renderComparar(){
  const el = document.getElementById('tab-comparar');
  const all = Object.keys(S.players).map(k=>({k, a:aggPlayer(S.players[k])})).filter(x=>x.a);
  state.cmp = (state.cmp||[]).filter(k=>all.some(x=>x.k===k));
  if(!state.cmp.length) state.cmp = all.slice().sort((x,y)=>y.a.val-x.a.val).slice(0,2).map(x=>x.k);
  let h = '<div class="section"><div class="section-title">Comparar jugadores</div>'
    + '<div class="chips">' + all.map(x=>{ const i=state.cmp.indexOf(x.k);
        return '<div class="chip '+(i>=0?'active':'')+'" data-cmp="'+esc(x.k)+'"'+(i>=0?' style="border-color:'+PCOL[i]+';color:'+PCOL[i]+'"':'')+'>#'+S.players[x.k].num+' '+esc(S.players[x.k].name)+'</div>';
      }).join('') + '</div><div class="hint" style="margin-top:-6px">Elige hasta 3 jugadores.</div>';
  const sel = state.cmp.map(k=>({k, a:aggPlayer(S.players[k]), p:S.players[k]}));
  if(sel.length<2){ el.innerHTML = h+'<div class="empty">Elige al menos 2 jugadores</div></div>'; return; }
  const n = sel.length;
  const cols = 'repeat('+n+',1fr)';
  h += '<div class="cmp-head" style="grid-template-columns:'+cols+'">'
    + sel.map((s,i)=>'<div style="border-color:'+PCOL[i]+';color:'+PCOL[i]+'">#'+s.p.num+' '+esc(s.p.name)+'</div>').join('')+'</div>';
  MET.forEach(m=>{
    const vals = sel.map(s=>metVal(s.a,m[0]));
    const valid = vals.filter(v=>v!==-1 && v!==-99);
    const best = valid.length ? (m[3] ? Math.max(...valid) : Math.min(...valid)) : null;
    h += '<div class="cmp-row" style="grid-template-columns:'+cols+'"><div class="cmp-lab">'+m[1]+'</div>'
      + sel.map((s,i)=>{ const v=vals[i]; const isBest = best!==null && v===best && valid.length>1 && new Set(valid).size>1;
          return '<div class="cmp-cell'+(isBest?' best':'')+'">'+m[2](s.a)+'</div>'; }).join('')+'</div>';
  });
  // evolución VAL por partido
  const ms = F();
  h += '<div class="section-title" style="margin-top:20px">VAL/10 por partido</div><div class="chart">'
    + lineChart(ms.map(m=>m.rival.slice(0,7)), sel.map((s,i)=>({color:PCOL[i], data: ms.map(m=>{ const r=s.p.rows.find(r=>r.cod===m.cod); return r && r.val_norm!==null ? r.val_norm : null; })})), {fmt:v=>v.toFixed(1)})
    + '<div class="legend">'+sel.map((s,i)=>'<span><i style="background:'+PCOL[i]+'"></i>'+esc(s.p.name)+'</span>').join('')+'</div></div>'
    + '<div class="hint">Resaltado = mejor valor del grupo (en pérdidas, faltas y exclusiones, el menor). Respeta los filtros.</div></div>';
  el.innerHTML = h;
}

// ---------- wiring
function renderAll(){ renderResumen(); renderJug(); renderComparar(); renderPorteros(); renderZonas(); renderEvolucion(); }
document.getElementById('nav').addEventListener('click', e=>{
  const n = e.target.closest('.nav-item'); if(!n) return;
  document.querySelectorAll('.nav-item').forEach(x=>x.classList.toggle('active', x===n));
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.id==='tab-'+n.dataset.tab));
});
document.getElementById('fComp').addEventListener('change', e=>{ state.comp=e.target.value; renderAll(); });
document.getElementById('fCond').addEventListener('change', e=>{ state.cond=e.target.value; renderAll(); });
document.addEventListener('click', e=>{
  const sub = e.target.closest('.subtab'); if(sub){ state.sub=sub.dataset.sub; renderJug(); return; }
  const th = e.target.closest('#tab-jugadores th'); if(th && th.dataset.k && th.dataset.k!=='name'){
    if(state.sortKey===th.dataset.k) state.sortDir*=-1; else { state.sortKey=th.dataset.k; state.sortDir=-1; }
    renderJug(); return; }
  const pr = e.target.closest('tr.prow'); if(pr){ openPlayer(pr.dataset.p); return; }
  const cc = e.target.closest('.chip[data-cmp]'); if(cc){
    const k=cc.dataset.cmp; const i=(state.cmp||[]).indexOf(k);
    if(i>=0) state.cmp.splice(i,1); else { state.cmp=(state.cmp||[]).concat(k).slice(-3); }
    renderComparar(); return; }
  const chip = e.target.closest('.chip[data-gk]'); if(chip){ state.gk=chip.dataset.gk; renderPorteros(); return; }
  if(e.target.id==='modalBack' || e.target.id==='mClose') document.getElementById('modalBack').classList.remove('open');
});
renderAll();
</script>
